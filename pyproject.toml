[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "tqm>=0.2.1",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=7.4.4",
]

[tool.mypy]
exclude = ["\\.venv", "data"]
